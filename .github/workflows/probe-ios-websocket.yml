name: PROBE - iOS Foundation WebSocket idle timeout

on:
  push:
    branches: [feature/adr-onboarding]
    paths: [.github/workflows/probe-ios-websocket.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-websocket-probe
  cancel-in-progress: false

jobs:
  register-manual-entrypoint:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - run: echo 'Manual entrypoint registered; no probe or device inputs used.'
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/adr-onboarding' &&
      github.repository == 'HangyiWang/iot-central-paad' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Measure isolated Foundation WebSocket idle behavior on an owned simulator
        timeout-minutes: 10
        run: node scripts/ci/probe-ios-websocket.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ios-websocket-probe-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/ios-websocket-probe/result.json
            build/ios-websocket-probe/command-errors.log
          retention-days: 3
          if-no-files-found: warn
