appId: ${APP_ID}
name: Decline only the observed iOS password-saving suggestion
---
- runFlow:
    when:
      platform: iOS
      visible:
        text: '^Save Password\?$'
      notVisible:
        id: connection-deviceKey
    commands:
      - assertVisible:
          text: '^Save$'
      - tapOn:
          text: '^Not Now$'
          retryTapIfNoChange: false
      - assertNotVisible:
          text: '^Save Password\?$'
